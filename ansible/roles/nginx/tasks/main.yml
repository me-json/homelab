- name: Install nginx + certbot (Cloudflare DNS)
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-dns-cloudflare
    state: present
    update_cache: true

- name: Let's Encrypt directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/letsencrypt
    - /etc/letsencrypt/renewal-hooks/deploy

- name: Cloudflare token for certbot (from Vault)
  ansible.builtin.copy:
    dest: /etc/letsencrypt/cloudflare.ini
    content: "dns_cloudflare_api_token = {{ cloudflare_dns_token }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Wildcard cert (first time only)
  ansible.builtin.command: >
    certbot certonly --non-interactive --agree-tos
    --register-unsafely-without-email
    --dns-cloudflare --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
    --cert-name {{ nginx_cert_domain }}
    -d {{ nginx_cert_domain }} -d '*.{{ nginx_cert_domain }}'
  args:
    creates: "/etc/letsencrypt/live/{{ nginx_cert_domain }}/fullchain.pem"

- name: Reload nginx after each renewal
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    mode: "0755"
    content: |
      #!/bin/sh
      systemctl reload nginx

- name: Auto-renew timer on
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: true
    state: started

- name: Shared snippets (ssl, proxy headers, websocket)
  ansible.builtin.template:
    src: "snippets/{{ item }}.j2"
    dest: "/etc/nginx/snippets/{{ item }}"
    mode: "0644"
  loop:
    - ssl.conf
    - proxy-headers.conf
    - websocket.conf
  notify: Reload nginx

- name: http-level config (websocket map, upstreams)
  ansible.builtin.template:
    src: conf.d/bruiser.conf.j2
    dest: /etc/nginx/conf.d/bruiser.conf
    mode: "0644"
  notify: Reload nginx

- name: Catch-all + http redirect
  ansible.builtin.template:
    src: default.conf.j2
    dest: /etc/nginx/sites-available/00-default.conf
    mode: "0644"
  notify: Reload nginx

- name: One file per site
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item.name }}.conf"
    mode: "0644"
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload nginx

- name: Enable sites
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ item }}.conf"
    state: link
  loop: "{{ ['00-default'] + (nginx_sites | map(attribute='name') | list) }}"
  notify: Reload nginx

- name: Remove old monolith + Debian default
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/bruiser.online
    - /etc/nginx/sites-available/bruiser.online
    - /etc/nginx/sites-enabled/default
  notify: Reload nginx

- name: nginx enabled
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
