- name: Keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker apt repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Architectures: {{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Docker drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Docker waits for ZFS stack datasets
  ansible.builtin.template:
    src: zfs.conf.j2
    dest: /etc/systemd/system/docker.service.d/zfs.conf
    mode: "0644"
  notify: Reload systemd

- name: Apply systemd changes before starting Docker
  ansible.builtin.meta: flush_handlers

- name: Docker enabled
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
