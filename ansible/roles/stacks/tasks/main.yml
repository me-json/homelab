- name: Datasets are mounted
  ansible.builtin.command: "mountpoint -q {{ stacks_root }}/{{ item.name }}"
  changed_when: false
  loop: "{{ stacks }}"
  loop_control:
    label: "{{ item.name }}"

- name: Compose + static config files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../stacks/{{ item.name }}/"
    dest: "{{ stacks_root }}/{{ item.name }}/"
    mode: "0644"
  loop: "{{ stacks }}"

- name: Data dirs (owned by container user)
  ansible.builtin.file:
    path: "{{ stacks_root }}/{{ item.0.name }}/{{ item.1.path }}"
    state: directory
    owner: "{{ item.1.owner }}"
    group: "{{ item.1.owner }}"
    mode: "0750"
  loop: "{{ stacks | subelements('dirs', skip_missing=True) }}"

- name: Templated configs (secrets from Vault)
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../stacks/{{ item.0.name }}/{{ item.1 }}.j2"
    dest: "{{ stacks_root }}/{{ item.0.name }}/{{ item.1 }}"
    mode: "0644"
  loop: "{{ stacks | subelements('templates', skip_missing=True) }}"

- name: .env files
  ansible.builtin.template:
    src: env.j2
    dest: "{{ stacks_root }}/{{ item.name }}/.env"
    mode: "0600"
  loop: "{{ stacks }}"

- name: Stacks up
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_root }}/{{ item.name }}"
    pull: missing
  loop: "{{ stacks }}"

- name: Home Assistant config exists (created on first start)
  ansible.builtin.wait_for:
    path: "{{ stacks_root }}/home/ha-config/configuration.yaml"
    timeout: 180
  when: "'home' in (stacks | map(attribute='name'))"

- name: Home Assistant trusts nginx as reverse proxy
  ansible.builtin.blockinfile:
    path: "{{ stacks_root }}/home/ha-config/configuration.yaml"
    marker: "# {mark} ANSIBLE MANAGED: reverse proxy"
    block: |
      http:
        use_x_forwarded_for: true
        trusted_proxies:
          - {{ minipc_ip }}
  when: "'home' in (stacks | map(attribute='name'))"
  notify:
    - Reset Home Assistant http storage
    - Restart Home Assistant
