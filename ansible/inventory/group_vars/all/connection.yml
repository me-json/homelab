ansible_user: jason
# .pub picks which Bitwarden key to use; IdentityAgent scopes Bitwarden to homelab only
ansible_ssh_private_key_file: ~/.ssh/homelab.pub
ansible_ssh_common_args: >-
  -o IdentitiesOnly=yes
  -o IdentityAgent=~/Library/Containers/com.bitwarden.desktop/Data/.bitwarden-ssh-agent.sock
