services:
  omada:
    image: mbentley/omada-controller:${OMADA_TAG}
    container_name: omada
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    environment:
      TZ: ${TZ}
 rm -f stacks/omada/.env.example ansible/roles/docker/files/zfs.conf
mkdir -p ansible/roles/{base,docker,stacks}/{tasks,templates,handlers}

cat > ansible/inventory/group_vars/all/vars.yml <<'EOF'
timezone: America/Los_Angeles
stacks_root: /opt/stacks

stacks:
  - name: omada
    env:
      OMADA_TAG: "6"
  # - name: monitoring
  # - name: home
  # - name: adguard
